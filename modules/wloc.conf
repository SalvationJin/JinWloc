#!name=Apple WLOC 定位修改
#!desc=Apple 网络定位修改 | 使用说明: https://github.com/SalvationJin/JinWloc#使用方法
#!author=Yu9191 Rewrite
#!homepage=https://github.com/SalvationJin/JinWloc

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://raw.githubusercontent.com/SalvationJin/JinWloc/refs/heads/main/dist/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/SalvationJin/JinWloc/refs/heads/main/dist/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
